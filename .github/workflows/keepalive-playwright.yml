name: Keep Supabase Active (Playwright)

on:
  workflow_dispatch:

jobs:
  visit-site:
    runs-on: ubuntu-latest

    steps:
      - name: Run Playwright
        uses: microsoft/playwright-github-action@v1

      - name: Create script
        run: |
          cat > keepalive.mjs << 'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true
          });

          const page = await browser.newPage();

          try {

            await page.goto(
              'https://still-light.org/gathering.html',
              { waitUntil: 'networkidle' }
            );

            await page.waitForTimeout(3000);

            await page.getByRole('button', {
              name: /step inside/i
            }).click();

            await page.waitForTimeout(2000);

            await page.getByRole('button', {
              name: /enter quietly/i
            }).click();

            await page.waitForTimeout(15000);

            console.log('Constellation reached.');

          } finally {

            await browser.close();

          }
          EOF

      - name: Execute script
        run: |
          node keepalive.mjs
``
